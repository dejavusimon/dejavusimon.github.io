<html lang="en">
<head>
  <meta charset="utf-8">

  <title>DEJAVUSIMON — Sisheng Su</title>
  <meta name="description" content="Portfolio of Sisheng (Simon) Su — under maintenance.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #fff; color: #111;
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow-x: hidden;
    }
    main { width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* DEJAVU | name + email | SIMON — the words part evenly to reveal two lines */
    .masthead {
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      font-size: clamp(40px, 8vw, 88px); letter-spacing: 0.02em; line-height: 1;
      display: flex; justify-content: center; align-items: last baseline;  /* lines sit on the wordmark's baseline */
      height: 1em; flex-wrap: wrap; align-content: flex-end;               /* row height fixed so the bar below never jumps */
    }
    .w { font-size: calc(1em * var(--wscale, 1)); transition: font-size .7s cubic-bezier(.65, 0, .35, 1); }
    .contact {
      width: 0; overflow: hidden; flex: none;
      transition: width .7s cubic-bezier(.65, 0, .35, 1);
    }
    .contact-inner {
      width: max-content;
      display: flex; flex-direction: column; align-items: flex-start;   /* both lines share one left edge */
      padding: 0 24px;                                                 /* equal gap to DEJAVU and SIMON */
      font-family: Inter, system-ui, sans-serif; font-weight: 400;
      font-size: 13px; line-height: 1.32; letter-spacing: 0.12em;
      text-transform: uppercase; white-space: nowrap; color: #555;
      text-align: left; opacity: 0; transition: opacity .35s ease;
    }
    .contact-inner a { display: inline-flex; align-items: center; gap: 0.7em; color: inherit; text-decoration: none; }
    .contact-inner a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .open .contact-inner { opacity: 1; transition-delay: .3s; }
    .status {
      font-size: 13px; letter-spacing: 0.12em;
      text-transform: uppercase; color: #555;
    }
    .logo-btn {
      position: fixed; top: 20px; left: 20px; z-index: 2;
      background: none; border: 0; padding: 0; cursor: pointer; line-height: 0;
    }
    .logo-btn img { width: 34px; height: auto; display: block; }
    .logo-btn:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
    /* small arrow at the logo's lower-right corner, nudging toward it */
    .nudge {
      position: absolute; left: calc(100% + 2px); top: calc(100% + 2px);
      width: 13px; height: 13px; overflow: visible;
      will-change: transform; backface-visibility: hidden;
      animation: nudge 1.3s ease-in-out infinite;
    }
    @keyframes nudge { 0%, 100% { transform: translate3d(3px, 3px, 0); } 50% { transform: translate3d(0, 0, 0); } }
    @media (max-width: 600px) {
      .logo-btn { top: 12px; left: 12px; }
      .logo-btn img { width: 26px; }
    }

    /* Loading bar made of the logo, repeated edge to edge */
    .loader {
      --tile-h: 34px;   /* logo height */
      --tile-w: 41px;   /* logo width, no gap: tiles join into one continuous band */
      position: relative; width: 100%; height: var(--tile-h);
      margin-top: 64px;
    }
    .loader .track, .loader .ink {
      position: absolute; inset: 0;
      background-repeat: repeat-x;
      background-size: var(--tile-w) var(--tile-h);
      animation: flow 1.6s linear infinite;   /* tiles stream right → left */
    }
    .loader .track { background-image: var(--outline); }
    .loader .ink   { background-image: var(--solid); clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
    @keyframes flow { to { background-position: calc(-1 * var(--tile-w)) 0; } }

    .status { margin-top: 68px; display: inline-flex; align-items: center; gap: 9px; }
    .gear { width: 14px; height: 14px; animation: spin 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Phones: same parting animation, smaller name/email so everything fits on one row */
    @media (max-width: 640px) {
      .contact-inner { font-size: 8.5px; letter-spacing: 0.08em; padding: 0 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader .track, .loader .ink, .nudge, .gear { animation: none; }
      .contact, .contact-inner, .w { transition: none !important; }
    }

    /* ---- hidden entrance: 5 quick clicks on the gear → PIN pad ---- */
    .gear { cursor: default; padding: 6px; margin: -6px; box-sizing: content-box; }
    .pin { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
           background: rgba(254,254,254,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .pin.open { opacity: 1; pointer-events: auto; }
    .pin form { display: grid; justify-items: center; gap: 18px; }
    .pin-label { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #555; max-width: 80vw; text-align: center; line-height: 1.5; }
    .pin-boxes { display: flex; gap: 12px; }
    .pin-boxes span { width: 46px; height: 56px; border: 2px solid #1b1b1b; border-radius: 10px; display: grid; place-items: center; }
    .pin-boxes span.on::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #1b1b1b; }
    /* own keypad: phone keyboards (some Chinese IMEs) were reordering digits in a text field */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px; margin-top: 10px; }
    .pin-pad button { height: 56px; border: 0; border-radius: 14px; background: #ececec; color: #1b1b1b;
                      font: 500 22px/1 system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .pin-pad button:active { background: #d6d6d6; }
    @media (hover: hover) and (pointer: fine) { .pin-pad { display: none; } }   /* desktop types on the keyboard */
    .pin.busy .pin-boxes span { border-color: #8a8a8a; }
    .pin.wrong .pin-boxes { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* ---- QR codes (phones only): button top-right, sheet with three codes stacked in the middle ---- */
    .qr-btn, .qr-sheet { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .qr-btn { display: block; position: fixed; top: 14px; right: 14px; z-index: 3; width: 44px; height: 44px; padding: 9px;
                border: 0; background: none; line-height: 0; -webkit-tap-highlight-color: transparent; }
      .qr-btn svg { width: 100%; height: 100%; }
      .qr-sheet { display: grid; place-items: center; position: fixed; inset: 0; z-index: 30;
                  background: rgba(254,254,254,.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
                  opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s;
                  padding: 64px 20px; box-sizing: border-box; }   /* equal top and bottom, clear of the × */
      .qr-sheet.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
      .qr-close { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px; padding: 10px; border: 0; background: none; line-height: 0; }
      .qr-close svg { width: 100%; height: 100%; }
      /* code size: share of the height left after the padding, gaps and labels, capped by width,
         so all three fit centred with room between them on any phone */
      .qr-stack { --gap: min(4svh, 28px); --q: min(calc((100svh - 128px - 2 * var(--gap) - 114px) / 3), 52vw, 210px);
                  display: flex; flex-direction: column; align-items: stretch; gap: var(--gap); }   /* all cards as wide as the widest */
      .qr-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 10px 9px;
                 border-radius: 22px; background: var(--qr-bg); color: var(--qr-fg); text-decoration: none;
                 transform: translateY(12px) scale(.96); opacity: 0; transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s; }
      .qr-sheet.open .qr-card { transform: none; opacity: 1; }
      .qr-sheet.open .qr-card:nth-child(2) { transition-delay: .05s; }
      .qr-sheet.open .qr-card:nth-child(3) { transition-delay: .1s; }
      .qr-card svg { width: var(--q); height: var(--q); display: block; border-radius: 12px; }   /* white tile = scanner quiet zone */
      .qr-label { font-size: 13px; font-weight: 600; letter-spacing: .04em; line-height: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .qr-card, .qr-sheet { transition: none !important; } }
  </style>
  <!-- no pinch/double-tap zoom on phones: iOS ignores user-scalable, so the gestures are blocked in script too -->
  <style>html { touch-action: pan-x pan-y; }</style>
  <script>
    (function () {
      var stop = function (e) { e.preventDefault(); };
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, stop, { passive: false }); });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
    })();
  </script>

  <script>
    // Logo redrawn as vector: a wave band above a solid bar (700 × 560 units).
    // Only the top and bottom edges are outlined (no side edges), so neighbouring
    // tiles join into one continuous wave line and one continuous bar.
    const W = "M0 47 C50 81 100 93 152 93 C262 93 404 0 545 0 C600 0 650 15 697 46";
    const Wb = "M697 241 C650 210 600 195 545 195 C404 195 262 288 152 288 C100 288 50 276 0 242";
    const shape = solid => `
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 -8 697 573' preserveAspectRatio='none'>
        <path d='${W} L${Wb.slice(1)} Z M0 340 H697 V557 H0 Z' fill='${solid ? "#111" : "#fff"}'/>
        ${solid ? "" : `<g fill='none' stroke='#111' stroke-width='1.5' vector-effect='non-scaling-stroke'>
          <path vector-effect='non-scaling-stroke' d='${W}'/>
          <path vector-effect='non-scaling-stroke' d='${Wb}'/>
          <path vector-effect='non-scaling-stroke' d='M0 340 H697 M0 557 H697'/>
        </g>`}
      </svg>`;
    const uri = s => `url("data:image/svg+xml,${encodeURIComponent(s.replace(/\s+/g, " "))}")`;
    const loader = document.querySelector(".loader");
    loader.style.setProperty("--outline", uri(shape(false)));
    loader.style.setProperty("--solid",   uri(shape(true)));

    // Logo toggles the contact info (no page reload).
    const btn = document.querySelector(".logo-btn");
    const masthead = document.querySelector(".masthead");
    const contact = document.getElementById("contact");
    const inner = contact.querySelector(".contact-inner");
    const words = [...masthead.querySelectorAll(".w")];
    function setOpen(open) {
      masthead.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open);
      btn.setAttribute("aria-label", open ? "Hide contact info" : "Show contact info");
      contact.setAttribute("aria-hidden", !open);
      inner.querySelectorAll("a").forEach(a => a.tabIndex = open ? 0 : -1);
      const cw = inner.offsetWidth;
      contact.style.width = open ? cw + "px" : "0px";
      // If DEJAVU + lines + SIMON won't fit the screen, shrink the two words just enough
      let scale = 1;
      if (open) {
        const wordsW = words.reduce((t, w) => t + w.scrollWidth / (parseFloat(getComputedStyle(masthead).getPropertyValue("--wscale")) || 1), 0);
        const avail = masthead.clientWidth - 24;
        if (wordsW + cw > avail) scale = Math.max(0.5, (avail - cw) / wordsW);
      }
      masthead.style.setProperty("--wscale", scale.toFixed(3));
    }
    btn.addEventListener("click", () => setOpen(!masthead.classList.contains("open")));
    document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
    const refit = () => {
      const els = [contact, ...words]; els.forEach(e => e.style.transition = "none");
      setOpen(masthead.classList.contains("open")); contact.offsetWidth;
      els.forEach(e => e.style.transition = "");
    };
    refit();
    addEventListener("resize", refit);
    document.fonts && document.fonts.ready.then(refit);

    // Progress that keeps creeping forward but never reaches the end.
    const start = performance.now();
    (function tick(now) {
      const t = (now - start) / 1000;
      const p = 100 * (1 - 1 / (1 + t / 20));   // 50% at 20s, 75% at 1 min, 90% at 3 min… never 100%
      loader.style.setProperty("--p", p.toFixed(3) + "%");
      requestAnimationFrame(tick);
    })(start);
  </script>

  <script>
    // Hidden entrance. The new site is stored encrypted in vault.bin; the PIN is never in this
    // page. It is the key: PBKDF2 (600k rounds) turns it into an AES-256 key, and only the right
    // PIN decrypts the file. Only a failed decryption counts as a wrong PIN; a failed download or
    // a browser that lacks a feature says so (that was being reported as "wrong" on some phones).
    (() => {
      const gear = document.querySelector(".gear"), pin = document.querySelector(".pin");
      const form = pin.querySelector("form"), boxes = pin.querySelectorAll(".pin-boxes span");
      let code = "";   // digits kept here, in tap order: no text field for a keyboard to reorder
      const label = pin.querySelector(".pin-label");
      let clicks = 0, timer, vault = null, busy = false;
      gear.addEventListener("click", () => {
        clearTimeout(timer); clicks++;
        if (clicks >= 5) { clicks = 0; open(); return; }
        timer = setTimeout(() => clicks = 0, 1200);          // clicks must come in quick succession
      });
      // the file comes in 256 KB pieces, each retried on its own (slow or flaky networks, e.g. from China),
      // then checked against the SHA-256 in its header, so a damaged download is never mistaken for a wrong PIN
      const PART = 262144, HEAD = 41;
      async function piece(from, to) {
        for (let tries = 0; ; tries++) {
          try {
            const r = await fetch(url, { cache: "no-store", headers: { Range: `bytes=${from}-${to}` } });
            if (!r.ok) throw new Error("http " + r.status);
            const b = await readAll(r, from);
            if (r.status === 200) return { whole: b };              // range ignored on the way: got the whole file
            if (b.length !== Math.min(to, size ? size - 1 : to) - from + 1 && size) throw new Error("short piece");
            return { part: b };
          } catch (e) { if (tries >= 4) throw e; await new Promise(r => setTimeout(r, 600 * (tries + 1))); }
        }
      }
      let url, size = 0, shown = 0;
      // read a response bit by bit so the label can show the download moving
      async function readAll(r, from) {
        if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
        const total = size || +(r.headers.get("content-range") || "").split("/")[1] || +r.headers.get("content-length") || 0;
        const rd = r.body.getReader(), parts = []; let n = 0;
        for (;;) {
          const { done, value } = await rd.read(); if (done) break;
          parts.push(value); n += value.length;
          const at = (r.status === 206 ? from : 0) + n;
          if (busy && Date.now() - shown > 150) { shown = Date.now(); say(total ? "Loading… " + Math.min(99, Math.round(100 * at / total)) + "%" : "Loading… " + (at / 1048576).toFixed(1) + " MB"); }
        }
        const out = new Uint8Array(n); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
        return out;
      }
      async function fetchAll() {
        url = "vault.bin?v=" + Date.now(); size = 0;
        const first = await piece(0, PART - 1);
        let all;
        if (first.whole) all = first.whole;
        else {
          const h = first.part;
          if (new TextDecoder().decode(h.subarray(0, 5)) !== "DJVS2") throw new Error("bad file");
          size = HEAD + new DataView(h.buffer, h.byteOffset).getUint32(5);
          all = new Uint8Array(size); all.set(h.subarray(0, Math.min(h.length, size)));
          let got = Math.min(h.length, size);
          for (let from = got; from < size; from += PART) {
            const p = await piece(from, Math.min(from + PART, size) - 1);
            if (p.whole) { all = p.whole; break; }
            all.set(p.part, from);
          }
        }
        if (new TextDecoder().decode(all.subarray(0, 5)) !== "DJVS2") throw new Error("bad file");
        const len = new DataView(all.buffer, all.byteOffset).getUint32(5);
        if (all.length !== HEAD + len) throw new Error("incomplete " + all.length + "/" + (HEAD + len));
        const body = all.subarray(HEAD);
        const sum = new Uint8Array(await crypto.subtle.digest("SHA-256", body));
        if (sum.some((x, i) => x !== all[9 + i])) throw new Error("damaged");
        return body;
      }
      async function download() {
        if (window.__VAULT) return Uint8Array.from(atob(window.__VAULT), c => c.charCodeAt(0)).subarray(HEAD);
        for (let tries = 0; ; tries++) {
          try { return await fetchAll(); }
          catch (e) { if (tries >= 2) throw Object.assign(e, { stage: "download" }); }
        }
      }
      // a failed download is never kept: the next try downloads again
      const getVault = () => vault ||= download().catch(e => { vault = null; throw e; });
      const say = t => { label.textContent = t; };
      function open() { pin.classList.add("open"); pin.setAttribute("aria-hidden", "false"); code = ""; say("Enter PIN"); paint(); getVault().catch(() => {}); }
      function close() { pin.classList.remove("open"); pin.setAttribute("aria-hidden", "true"); }
      const paint = () => boxes.forEach((b, i) => b.classList.toggle("on", i < code.length));
      const press = k => {
        if (busy) return;
        if (k === "del") code = code.slice(0, -1);
        else if (code.length < 4) code += k;
        paint(); if (code.length === 4) unlock(code);
      };
      pin.addEventListener("click", e => { if (e.target === pin) close(); });
      pin.querySelector(".pin-pad").addEventListener("click", e => {
        const b = e.target.closest("button"); if (b) press(b.hasAttribute("data-del") ? "del" : b.textContent);
      });
      addEventListener("keydown", e => {
        if (!pin.classList.contains("open")) return;
        if (e.key === "Escape") close();
        else if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === "Backspace") press("del");
      });
      form.addEventListener("submit", e => e.preventDefault());
      async function gunzip(buf) {
        if ("DecompressionStream" in window) {
          try { return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); } catch (e) {}
        }
        return new TextDecoder().decode(window.__gunzip(new Uint8Array(buf)));   // fallback for browsers without it
      }
      async function open1(code, u, iters) {
        const salt = u.slice(0, 16), iv = u.slice(16, 28), data = u.slice(28);
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iters, hash: "SHA-256" },
                                                  base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        return crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      }
      // known answer ("ok" sealed with 0000): if this fails, the browser's decryption is broken, not the PIN
      const selfTest = () => open1("0000", Uint8Array.from(atob("A8zcW4xVrtE0OP182gn7TFpWFgkIPHbWPIzM7Rii18wHhP0WbfDhy04DhBmq0g=="), c => c.charCodeAt(0)), 1000)
        .then(b => new TextDecoder().decode(b) === "ok", () => false);
      async function unlock(entered) {
        busy = true; pin.classList.add("busy"); say("Unlocking…");
        let stage = "download";
        try {
          if (!window.crypto || !crypto.subtle) throw Object.assign(new Error("no crypto"), { stage: "browser" });
          const u = await getVault();
          stage = "key"; say("Unlocking…");
          stage = "decrypt";
          const zipped = await open1(entered, u, 600000);
          stage = "unpack";
          const html = await gunzip(zipped);
          document.open(); document.write(html); document.close();
        } catch (e) {
          busy = false; pin.classList.remove("busy");
          let wrong = stage === "decrypt";
          // what reached the page, as code points, so a keyboard sending odd characters shows up
          const typed = [...entered].map(ch => ch.charCodeAt(0) - 48).join("");
          if (wrong && !(await selfTest())) { wrong = false; e.stage = "crypto"; }
          pin.classList.add("wrong");
          say(wrong ? "Wrong PIN · " + typed + " · b3" : stage === "download" ? "Couldn't load (" + e.message + "). Try again"
                                  : "This browser couldn't open it (" + (e.stage || stage) + ", b3). Try Chrome");
          setTimeout(() => { pin.classList.remove("wrong"); code = ""; paint(); }, 450);
        }
      }
    })();

    // QR sheet: open from the top-right button, close with ×, a tap on the backdrop, or Escape
    (() => {
      const btn = document.querySelector(".qr-btn"), sheet = document.querySelector(".qr-sheet");
      const set = on => { sheet.classList.toggle("open", on); sheet.setAttribute("aria-hidden", String(!on)); btn.setAttribute("aria-expanded", String(on)); };
      btn.addEventListener("click", () => set(true));
      sheet.querySelector(".qr-close").addEventListener("click", () => set(false));
      sheet.addEventListener("click", e => { if (e.target === sheet || e.target.classList.contains("qr-stack")) set(false); });
      addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
    })();
  </script>
